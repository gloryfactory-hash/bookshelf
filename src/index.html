<!doctype html>
<html lang="ko" data-me="{{ME}}"{{RUNNER}}>
<head>
<meta charset="utf-8">
{{BASE}}
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E{{FAVICON}}%3C/text%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/Paperlogy-7Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css?v={{VER}}">
{{OG}}
</head>
<body class="noselect">
<header class="top">
  <div class="brand"><span class="bb">{{CHANNEL}}</span><span class="sep" aria-hidden="true"></span><nav class="who" aria-label="작가 서가">{{WHO}}</nav></div>
  <nav class="nav" aria-label="보기 전환">
    <button id="navShelf" aria-pressed="true">대표작·신간</button>
    <button id="navLib" aria-pressed="false">전체 작품<span class="n" id="navN"></span></button>
    {{NAV_ABOUT}}
    <a class="yt" href="{{YOUTUBE}}" target="_blank" rel="noopener"><svg viewBox="0 0 16 12" aria-hidden="true"><rect width="16" height="12" rx="3" fill="currentColor"/><path d="M6.5 3.5v5l4-2.5z" fill="var(--paper)"/></svg><span>{{CHANNEL}} 채널</span></a>
  </nav>
</header>

<div class="kan l" aria-hidden="true">{{KAN_L}}</div>
<div class="kan r" aria-hidden="true">{{KAN_R}}</div>
{{TAGLINE}}
<div class="floor" aria-hidden="true"></div>
<div class="probe" id="probe"></div>

<section class="shelf" id="shelf" tabindex="0" aria-label="대표작과 신간 책장. 왼쪽, 오른쪽 화살표 키로 넘기고 Enter로 책 소개를 엽니다.">
  <div class="stage" id="stage"></div>
</section>

<div class="cap" id="cap" aria-live="polite">
  <div class="m" id="mTitle" role="button" tabindex="0"></div>
  <div class="m" id="mSub"></div>
  <div class="crule"></div>
  <div class="m" id="mYear"></div>
</div>
<button class="arrow prev" id="prev" aria-label="이전 책"><svg viewBox="0 0 24 12" aria-hidden="true"><path d="M6 1L1 6l5 5M1 6h23" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
<button class="arrow next" id="next" aria-label="다음 책"><svg viewBox="0 0 24 12" aria-hidden="true"><path d="M18 1l5 5-5 5M23 6H0" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>

<nav class="gr" id="gr" aria-label="학년으로 찾기"><p class="gl">학년으로 찾기</p><div class="gb" id="grb"></div></nav>
<div class="tl" id="tl" aria-hidden="true"><div class="start"><b>3</b><b>2</b><b>1</b></div><div class="base"></div><div class="dot" id="dot"></div><div class="hit" id="tlhit"></div></div>

<footer class="foot lbl">
  <span>© {{AUTHOR}} · {{CHANNEL}}</span>
  <div class="fr"><a class="news" href="{{NEWS}}">새 책 소식 받기</a>{{FOOT_TALK}}</div>
</footer>

<section class="lib" id="lib" hidden aria-label="전체 작품">
  <div class="libin">
    <div class="lhead">
      <div class="lht"><h1><span id="libH">전체 작품</span><span class="n" id="libN"></span></h1><p class="lintro" id="libIntro" hidden></p></div>
      <div class="tools">
        <label class="search"><span class="sr">제목 검색</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.4"/></svg>
          <input id="q" type="search" placeholder="제목 검색 (초성도 돼요)" autocomplete="off">
        </label>
        <label><span class="sr">정렬</span>
          <select class="sort" id="sort"><option value="new">최신순</option><option value="old">오래된순</option><option value="title">가나다순</option></select>
        </label>
      </div>
    </div>
    <div class="seg" id="seg" role="group" aria-label="대상"></div>
    <div class="chips" id="chips" role="group" aria-label="주제"></div>
    <div class="active" id="active" aria-live="polite"></div>
    <div class="grid" id="grid"></div>
    <section class="lsub" id="libSub" hidden></section>
    <div class="libfoot lbl"><span>© {{AUTHOR}} · {{CHANNEL}}</span><span id="libNote"></span></div>
  </div>
</section>

{{ABOUT}}

<section class="detail" id="detail" hidden tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="dhead"><span class="dact"><button class="close box lbl" id="close">닫기</button><button class="box lbl share" id="share" type="button">주소 복사</button></span><div class="dbrand lbl"><b>{{AUTHOR}}</b><span class="ln"></span><span>{{BRAND_SUB}}</span></div></div>
  <div class="dgrid">
    <div class="dtext" id="dtext">
      <div class="m"><span class="dsub" id="dSub"></span></div>
      <div class="m"><h2 class="dtitle" id="dTitle"></h2></div>
      <div class="m"><p class="done" id="dOne"></p></div>
      <div class="m"><div class="drec" id="dRec"></div></div>
      <div class="m"><div class="dkw" id="dKw"></div></div>
      <div class="m"><p class="dsyn" id="dSyn"></p></div>
      <div class="m"><div class="dbib" id="dBib"></div></div>
      <div class="m"><div class="dbuy" id="dBuy"></div></div>
    </div>
    <div class="dposter">
      <svg id="poster" viewBox="0 0 474 900" aria-hidden="true">
        <defs>
          <filter id="ink" x="-60%" y="-60%" width="220%" height="220%">
            <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="3" seed="7" result="t"/>
            <feDisplacementMap in="SourceGraphic" in2="t" scale="120" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <mask id="pm" maskUnits="userSpaceOnUse" x="-500" y="-500" width="1600" height="2000"><g filter="url(#ink)" fill="#fff" id="blots"></g></mask>
          <clipPath id="pc"><rect id="pcr" width="474" height="900"/></clipPath>
        </defs>
        <g clip-path="url(#pc)"><image id="pimg" x="0" y="0" width="474" height="900" preserveAspectRatio="none" mask="url(#pm)"/></g>
      </svg>
    </div>
    <div class="drel" id="dRelS" hidden><h3>같은 시리즈</h3><div class="row"></div></div>
    <div class="drel" id="dRelK" hidden><h3>비슷한 주제의 책</h3><div class="row"></div></div>
  </div>
  <div class="dbar"><button class="box lbl" id="closeB" type="button">닫기</button><button class="box lbl" id="shareB" type="button">공유</button></div>
</section>


<script type="application/json" id="books-data">{{BOOKS_JSON}}</script>
<script type="application/json" id="site-data">{{SITE_JSON}}</script>
<script src="assets/app.js?v={{VER}}" defer></script>
</body>
</html>
