<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>{{TITLE}}</title>
{{OG}}
<style>
/* 수업 자료 받는 쪽 (2026-11-25, 서가 회의록). 서가에 올린 파일(materials의 file)일 때 build가 <서가>/<path>/로 만든다.
   인스타·카카오톡 안 브라우저에서 PDF가 열리기만 하고 저장 단추를 못 찾는 일을 막으려고 바로 넘기지 않고 이 쪽을 둔다.
   색·글꼴은 ig 쪽과 같은 집안(페이퍼로지, 채널 꿀색 면 + 면 위 글자, 크림 바탕 없음) */
@font-face{font-family:'Paperozi';src:url('{{UP}}assets/fonts/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Paperozi';src:url('{{UP}}assets/fonts/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Paperozi';src:url('{{UP}}assets/fonts/Paperlogy-9Black.woff2') format('woff2');font-weight:900;font-display:swap}
:root{
  --paper:#EDF0EE; --sheet:#FFFFFF; --ink:#1E2421; --muted:#5E6661; --hair:rgba(30,36,33,.14);
  --orange:#e3a03e; --orange-on:#3a2206; --orange-deep:#9c5a26; --chip:rgba(227,160,62,.14); --shadow:40,48,44;
  --fs-2:14px; --fs-3:16.5px; --fs-4:22px; --fs-5:34px;
  --sans:'Paperozi','Pretendard',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#171B19; --sheet:#1F2522; --ink:#E9ECE9; --muted:#A2AAA5; --hair:rgba(233,236,233,.16); --shadow:0,0,0;
  --orange-deep:#E3A03E; --chip:rgba(227,160,62,.16); color-scheme:dark}}
:root[data-theme="dark"]{--paper:#171B19; --sheet:#1F2522; --ink:#E9ECE9; --muted:#A2AAA5; --hair:rgba(233,236,233,.16); --shadow:0,0,0;
  --orange-deep:#E3A03E; --chip:rgba(227,160,62,.16); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:500;-webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.5}
a{color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--orange-deep);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 0;font-size:var(--fs-2);font-weight:700}
.top a{color:var(--muted);text-decoration:none}
@media (hover:hover){.top a:hover{color:var(--ink);text-decoration:underline;text-decoration-color:var(--orange);text-underline-offset:4px}}

.head{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:center;margin:24px 0 20px}
.head img{width:88px;height:auto;border-radius:3px;box-shadow:0 10px 20px -10px rgba(var(--shadow),.55)}
.kicker{font-size:var(--fs-2);font-weight:700;color:var(--orange-deep);margin:0 0 4px}
h1{font-size:var(--fs-4);font-weight:900;line-height:1.3;margin:0 0 6px;letter-spacing:0}
.meta{font-size:var(--fs-2);color:var(--muted);margin:0}

.get{background:var(--sheet);border-radius:14px;padding:18px;box-shadow:0 1px 0 var(--hair),0 14px 30px -18px rgba(var(--shadow),.45)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 16px;border-radius:8px;text-decoration:none;font-weight:700;font-size:var(--fs-3);transition:background-color .2s,border-color .2s,color .2s}
.btn.fill{background:var(--orange);color:var(--orange-on);font-size:var(--fs-4);font-weight:900;min-height:64px}
.btn.fill small{font-size:var(--fs-2);font-weight:700;opacity:.8}
.btn.line{border:1.5px solid var(--hair);color:var(--ink);margin-top:8px}
@media (hover:hover){.btn.fill:hover{background:color-mix(in srgb,var(--orange) 86%,#000)}.btn.line:hover{border-color:var(--orange-deep);color:var(--orange-deep);background:var(--chip)}}
.btn.fill:active{background:color-mix(in srgb,var(--orange) 86%,#000)}
.btn.line:active{background:var(--chip)}
.note{font-size:var(--fs-2);color:var(--muted);margin:12px 0 0;text-align:center}

/* 인스타·카톡 같은 앱 안 브라우저일 때만 보이는 안내 */
.inapp{display:none;margin:0 0 14px;padding:14px 16px;border-radius:10px;background:var(--chip);border:1.5px solid var(--orange);font-size:var(--fs-3)}
.inapp b{display:block;font-weight:700;margin-bottom:4px}
.inapp span{font-size:var(--fs-2);color:var(--muted)}
.is-inapp .inapp{display:block}

h2{font-size:var(--fs-2);font-weight:700;color:var(--muted);margin:32px 0 12px}
.pages{display:grid;grid-template-columns:1fr 1fr;gap:12px;list-style:none;margin:0;padding:0}
.pages li{background:var(--sheet);border-radius:8px;padding:8px;box-shadow:0 1px 0 var(--hair)}
.pages img{width:100%;height:auto;border:1px solid var(--hair)}
.pages span{display:block;font-size:var(--fs-2);color:var(--muted);text-align:center;margin-top:6px}
.free{font-size:var(--fs-3);margin:24px 0 0}
.more{display:grid;gap:8px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><span>부부작당 수업 자료</span><a href="{{UP}}ig/">소개한 책 모두 보기 →</a></header>

<div class="head">
  <img src="{{COVER}}" alt="{{BOOK}} 표지" width="88">
  <div><p class="kicker">수업 활동지</p><h1>{{BOOK}}<br>{{LABEL}}</h1><p class="meta">{{META}}</p></div>
</div>

<div class="inapp" role="note"><b>저장이 안 되면 다른 브라우저로 열어 주세요.</b><span>오른쪽 위나 아래의 ⋯ 메뉴 → ‘외부 브라우저로 열기’(또는 ‘Safari로 열기’, ‘다른 브라우저로 열기’)</span></div>

<section class="get" aria-label="파일 받기">
  <a class="btn fill" href="{{FILE}}" download="{{FILENAME}}">PDF 내려받기 <small>{{SIZE}}</small></a>
  <a class="btn line" href="{{FILE}}" target="_blank" rel="noopener">받지 않고 열어 보기</a>
  <p class="note">휴대폰에서는 ‘파일’ 앱(아이폰)이나 ‘다운로드’ 폴더(안드로이드)에 저장돼요.</p>
</section>

{{PREVIEWS}}
<p class="free">{{NOTE}}</p>
<nav class="more" aria-label="더 보기">
  <a class="btn line" href="{{BOOKHREF}}">이 책 소개 보기</a>
</nav>
</div>
<script>
  // 인스타그램·페이스북·카카오톡·네이버·라인 앱 안 브라우저면 안내를 보인다
  if (/Instagram|FBAN|FBAV|KAKAOTALK|NAVER\(inapp|Line\//i.test(navigator.userAgent)) document.documentElement.classList.add('is-inapp');
</script>
</body>
</html>
